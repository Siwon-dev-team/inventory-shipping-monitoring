# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "832917927410ac7bd947fa7ffbef7a34"
name = "inventory-shipping-monitoring"
application_url = "https://inventorymanagement.spfmktplace.tech.siwon.ca"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory_levels/update"
  topics = [ "inventory_levels/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # NOTE: orders/create webhook requires protected customer data approval
  # Request access at Partner Dashboard > Apps > [App] > API access > Protected customer data
  # Once approved, uncomment:
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/create"
  # topics = [ "orders/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_orders,read_products,write_inventory"

[auth]
redirect_urls = [
  "https://inventorymanagement.spfmktplace.tech.siwon.ca/auth/callback",
  "https://inventorymanagement.spfmktplace.tech.siwon.ca/auth/shopify/callback",
  "https://inventorymanagement.spfmktplace.tech.siwon.ca/api/auth/callback"
]
